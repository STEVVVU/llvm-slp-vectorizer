name: bounded-slp

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-llvm-23:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Prepare the pinned official LLVM 23.1.4 SDK
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install --yes \
            cmake ninja-build g++ zstd zlib1g-dev libzstd-dev libxml2-dev libffi-dev libedit-dev
          archive="$RUNNER_TEMP/LLVM-23.1.4-Linux-X64.tar.zst"
          curl --fail --location --retry 3 \
            https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.4/LLVM-23.1.4-Linux-X64.tar.zst \
            --output "$archive"
          echo "efdd1dbd089b99bfcfcde7b8eb1236163f2e88df5a981cca4f783ec9cb5e0378  $archive" | sha256sum --check
          sdk="$RUNNER_TEMP/llvm-23.1.4"
          mkdir "$sdk"
          tar --use-compress-program='zstd --decompress --long=30' \
            --extract --file "$archive" --directory "$sdk" --strip-components=1
          filecheck="$RUNNER_TEMP/filecheck-23.1.4"
          mkdir "$filecheck"
          source=https://raw.githubusercontent.com/llvm/llvm-project/llvmorg-23.1.4/llvm
          curl --fail --location --retry 3 "$source/utils/FileCheck/FileCheck.cpp" --output "$filecheck/main.cpp"
          curl --fail --location --retry 3 "$source/lib/FileCheck/FileCheck.cpp" --output "$filecheck/library.cpp"
          curl --fail --location --retry 3 "$source/lib/FileCheck/FileCheckImpl.h" --output "$filecheck/FileCheckImpl.h"
          echo "3c6568b68c5c6d6ec8b9a2acb378a6949c9f5004ae009d2597b7f760f944f320  $filecheck/main.cpp" | sha256sum --check
          echo "74beb71f22b14d95a4f73cd0a809906d8aaea08a0365ff5ee29315ab4c349e58  $filecheck/library.cpp" | sha256sum --check
          echo "bb611f9088c8eda289ee77ec6777bda0f4d06a34084dba56c21b127d7491f49a  $filecheck/FileCheckImpl.h" | sha256sum --check
          read -r -a cxxflags <<< "$("$sdk/bin/llvm-config" --cxxflags)"
          read -r -a ldflags <<< "$("$sdk/bin/llvm-config" --ldflags)"
          read -r -a llvmlibs <<< "$("$sdk/bin/llvm-config" --link-static --libs support)"
          read -r -a systemlibs <<< "$("$sdk/bin/llvm-config" --link-static --system-libs)"
          g++ "${cxxflags[@]}" "$filecheck/main.cpp" "$filecheck/library.cpp" \
            -o "$sdk/bin/FileCheck" "${ldflags[@]}" "${llvmlibs[@]}" "${systemlibs[@]}"
          "$sdk/bin/FileCheck" --version
          test ! -e /usr/lib/llvm-23
          sudo ln -s "$sdk" /usr/lib/llvm-23
          test "$(/usr/lib/llvm-23/bin/llvm-config --version)" = 23.1.4
          test -x /usr/lib/llvm-23/bin/opt
          test -x /usr/lib/llvm-23/bin/FileCheck
          test -f /usr/lib/llvm-23/lib/cmake/llvm/LLVMConfig.cmake

      - name: Build pass plugin
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build/ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLT_LLVM_INSTALL_DIR=/usr/lib/llvm-23 \
            -DLLVM_DIR=/usr/lib/llvm-23/lib/cmake/llvm
          cmake --build build/ci --target BoundedSLP

      - name: Verify IR packing and native SIMD lowering
        shell: bash
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="/usr/lib/llvm-23/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          plugin="$PWD/build/ci/lib/libBoundedSLP.so"
          /usr/lib/llvm-23/bin/opt -load-pass-plugin "$plugin" \
            -passes=bounded-slp -verify-each -S test/BoundedSLP.ll \
            -o build/ci/BoundedSLP.exact.ll
          /usr/lib/llvm-23/bin/FileCheck test/BoundedSLP.ll \
            --check-prefix=EXACT < build/ci/BoundedSLP.exact.ll
          /usr/lib/llvm-23/bin/opt -load-pass-plugin "$plugin" \
            -passes=bounded-slp-greedy -verify-each -S test/BoundedSLP.ll \
            -o build/ci/BoundedSLP.greedy.ll
          /usr/lib/llvm-23/bin/FileCheck test/BoundedSLP.ll \
            --check-prefix=GREEDY < build/ci/BoundedSLP.greedy.ll
          /usr/lib/llvm-23/bin/llc -O2 -mattr=+sse2 -filetype=asm \
            build/ci/BoundedSLP.exact.ll -o build/ci/BoundedSLP.s
          grep -Eq '\bpaddd\b' build/ci/BoundedSLP.s

      - name: Frozen native kernel benchmark
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="/usr/lib/llvm-23/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          python3 scripts/benchmark.py --run --before-ref 66b66ba2e86640a8f96bfc5d0299461b10513c29

      - name: Retain raw benchmark and diagnostic evidence
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-slp-benchmark
          path: .verify/benchmark/
          include-hidden-files: true
          if-no-files-found: error
